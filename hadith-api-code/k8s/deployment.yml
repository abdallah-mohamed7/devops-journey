apiVersion: apps/v1
kind: Deployment
metadata:
  name: hadith-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hadith-api
  template:
    metadata:
      labels:
        app: hadith-api
    spec:
      containers:
      - name: hadith-container
        image: abdallahmohamed7/hadith-api:latest
        ports:
        - containerPort: 8082
        livenessProbe:
          httpGet:
            path: /api/hadith
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/hadith
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: hadith-config
        - secretRef:
            name: hadith-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
